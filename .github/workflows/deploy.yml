name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: "0"

concurrency:
  group: tailos-api-production
  queue: max

jobs:
  revision:
    if: >-
      vars.TAILOS_D1_DATABASE_ID != '' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check the current main revision
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current_sha" == "$TESTED_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped deployment: main is at $current_sha, CI tested $TESTED_SHA"
          fi

  api:
    name: Deploy API and Runner
    needs: revision
    if: needs.revision.outputs.deploy == 'true'
    environment:
      name: production
      url: https://api.tailos.app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare
        run: pnpm --filter @tailos/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAILOS_D1_DATABASE_ID: ${{ vars.TAILOS_D1_DATABASE_ID }}
          TAILOS_CREDENTIALS_FROM_WORKER: ${{ vars.TAILOS_CREDENTIALS_FROM_WORKER }}
          TAILOS_GH_APP_ID: ${{ vars.TAILOS_GH_APP_ID }}
          TAILOS_GH_APP_PRIVATE_KEY: ${{ secrets.TAILOS_GH_APP_PRIVATE_KEY }}
          TAILOS_GH_WEBHOOK_SECRET: ${{ secrets.TAILOS_GH_WEBHOOK_SECRET }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          TAILOS_GITHUB_OAUTH_CLIENT_ID: ${{ vars.TAILOS_GITHUB_OAUTH_CLIENT_ID }}
          TAILOS_OPERATOR_GITHUB_ID: ${{ vars.TAILOS_OPERATOR_GITHUB_ID }}
          TAILOS_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.TAILOS_GITHUB_OAUTH_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - name: Verify the deployed Worker
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 10 --max-time 8 https://api.tailos.app/health |
            jq -e '.status == "ok" and .service == "tailos-api"'

  web:
    name: Deploy Web
    needs: api
    environment:
      name: production-web
      url: https://tailos.app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build Web Worker
        run: pnpm --filter @tailos/web run build
      - name: Recheck the current main revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current_sha" == "$TESTED_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped Web deployment: main is at $current_sha, CI tested $TESTED_SHA"
          fi
      - name: Deploy Web to Cloudflare
        if: steps.revision.outputs.deploy == 'true'
        run: pnpm --filter @tailos/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the deployed Web Worker
        if: steps.revision.outputs.deploy == 'true'
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 8 https://tailos.app/health |
              jq -e '.status == "ok" and .service == "tailos-web"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
