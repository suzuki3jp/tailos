name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: fmt
            script: format:check
          - check: lint
            script: lint
          - check: test
            script: test
          - check: typecheck
            script: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: pnpm run ${{ matrix.script }}

      - name: Build the Web Worker
        if: matrix.check == 'typecheck'
        run: pnpm --filter @meguri/web run build

      - name: Verify Web document security headers
        if: matrix.check == 'typecheck'
        working-directory: apps/web
        shell: bash
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 3017 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          headers=$(curl --silent --show-error --fail --retry 8 --retry-all-errors \
            --retry-delay 1 --max-time 10 --dump-header - --output /dev/null \
            http://127.0.0.1:3017/login)
          grep -Eiq "^content-security-policy: .*script-src 'self' 'nonce-[^']+'.*base-uri 'none'; frame-ancestors 'none'" <<< "$headers"
          grep -Eiq '^referrer-policy: strict-origin' <<< "$headers"
          grep -Eiq '^x-frame-options: deny' <<< "$headers"
          grep -Eiq '^x-content-type-options: nosniff' <<< "$headers"
          grep -Eiq '^cache-control: private, no-store' <<< "$headers"
