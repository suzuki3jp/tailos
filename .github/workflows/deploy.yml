name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meguri-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MEGURI_APP_ORIGIN: ${{ vars.MEGURI_APP_ORIGIN }}
      MEGURI_WORKER_NAME: ${{ vars.MEGURI_WORKER_NAME }}
      MEGURI_BUCKET_NAME: ${{ vars.MEGURI_BUCKET_NAME }}
      MEGURI_PROJECTS: ${{ vars.MEGURI_PROJECTS }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
      MEGURI_GH_APP_ID: ${{ vars.MEGURI_GH_APP_ID }}
      MEGURI_GH_APP_PRIVATE_KEY: ${{ secrets.MEGURI_GH_APP_PRIVATE_KEY }}
      MEGURI_GH_WEBHOOK_SECRET: ${{ secrets.MEGURI_GH_WEBHOOK_SECRET }}
    steps:
      - name: Prepare deployment paths
        run: printf 'MEGURI_SECRETS_FILE=%s/meguri-secrets.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate production settings
        run: node --experimental-strip-types scripts/configure-deploy.ts
      - name: Ensure artifact storage exists
        run: node scripts/ensure-bucket.mjs
      - name: Check the runner image before publishing
        run: docker build --tag meguri-runner:preflight .
      - name: Verify the Linux runner
        run: node scripts/check-image.mjs meguri-runner:preflight
      - name: Build and deploy Worker and Sandbox image
        run: npx wrangler deploy --config wrangler.deploy.json --secrets-file "$MEGURI_SECRETS_FILE"
      - name: Check deployed service
        # The first Custom Domain deployment can need time for DNS and TLS provisioning.
        run: curl --fail --retry 18 --retry-delay 10 --retry-all-errors --retry-max-time 240 --connect-timeout 10 --max-time 20 "${MEGURI_APP_ORIGIN}/health"
      - name: Remove temporary secrets
        if: always()
        run: rm -f "$MEGURI_SECRETS_FILE"
