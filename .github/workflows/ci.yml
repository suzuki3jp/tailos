name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate Worker bundle and Cloudflare configuration
        run: npx wrangler deploy --dry-run --containers-rollout none
      - name: Build the runner image
        run: docker build --tag meguri-runner:test .
      - name: Verify the Linux runner
        run: node scripts/check-image.mjs meguri-runner:test
