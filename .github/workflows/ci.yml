name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: fmt
            script: format:check
          - check: lint
            script: lint
          - check: test
            script: test
          - check: typecheck
            script: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: pnpm run ${{ matrix.script }}
        # lint includes Oxlint (API/Web boundaries) and Steiger (FSD).
        # test includes CLI regression fixtures for both Web linters.

      - name: Build the Web Worker
        if: matrix.check == 'typecheck'
        run: pnpm --filter @tailos/web run build

  preview-build:
    name: Build PR Preview
    needs: checks
    if: >-
      vars.TAILOS_PREVIEW_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Build PR Web and API
        env:
          PR: ${{ github.event.pull_request.number }}
          TAILOS_PREVIEW_WEB_DOMAIN: ${{ vars.TAILOS_PREVIEW_WEB_DOMAIN }}
          TAILOS_PREVIEW_API_DOMAIN: ${{ vars.TAILOS_PREVIEW_API_DOMAIN }}
          WRANGLER_SEND_METRICS: "false"
        run: node tools/preview/build.mjs "$PR" "$RUNNER_TEMP/preview"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/preview/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
